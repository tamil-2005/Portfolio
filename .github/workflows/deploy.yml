name: CI/CD Deploy to Oracle Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deploy at a time; cancel stale runs if a newer commit lands
concurrency:
  group: deploy-oracle
  cancel-in-progress: true

# Permissions needed to push the image to GitHub Container Registry (GHCR)
permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/pro-portfolio
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ---------------------------------------------------------------
      # 1. Checkout Code
      # ---------------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # 2. Install Dependencies
      # ---------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # ---------------------------------------------------------------
      # 3. Run Tests (Optional) — uncomment when tests exist
      # ---------------------------------------------------------------
      # - name: Run Tests
      #   run: npm test --if-present

      # ---------------------------------------------------------------
      # 4. Build React App
      # ---------------------------------------------------------------
      - name: Build React App
        run: npm run build

      # ---------------------------------------------------------------
      # 5. Build Docker Image
      # ---------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------------------------------------------------------
      # 6. SSH to Oracle VM → Pull Image → Restart Container
      # ---------------------------------------------------------------
      - name: Deploy to Oracle Cloud VM over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "==> Pulling image: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
            docker pull ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

            echo "==> Ensuring deployment directory exists"
            mkdir -p /opt/pro-portfolio

            echo "==> Writing/updating compose file"
            cat > /opt/pro-portfolio/docker-compose.yml <<EOF
            services:
              web:
                image: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
                container_name: pro-portfolio
                restart: unless-stopped
                ports:
                  - "80:80"
                  - "443:443"
                volumes:
                  - /etc/letsencrypt/live/devtamil.online/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
                  - /etc/letsencrypt/live/devtamil.online/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
                  - /var/www/certbot:/var/www/certbot
            EOF

            echo "==> Removing previous container (if any)"
            docker rm -f pro-portfolio || true

            echo "==> Ensuring TLS certificate exists (Let's Encrypt)"
            if [ ! -f /etc/letsencrypt/live/devtamil.online/fullchain.pem ]; then
              echo "No certificate found — issuing with standalone challenge (port 80 is free)"
              sudo certbot certonly --standalone \
                -d devtamil.online -d www.devtamil.online \
                --non-interactive --agree-tos \
                --email ${{ secrets.CERTBOT_EMAIL }} \
                --cert-name devtamil.online
            fi

            echo "==> Starting container"
            cd /opt/pro-portfolio
            docker compose up -d --pull always

            echo "==> Pruning old images"
            docker image prune -f
            echo "==> Deploy complete"